name: 官网巡检

on:
  schedule:
    - cron: '17 1 * * 1' # 每周一
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 国内不少网站会拦截境外 IP，这里只出报告不判失败
      - run: npm run check-links
