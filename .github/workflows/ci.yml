name: CI

on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:
  schedule:
    - cron: '43 2 * * *' # Refresh verification expiry on the default branch.

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run audit:data
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: catalog-quality
          path: .reports/quality.json
          retention-days: 30
      - name: Build for publication
        if: vars.ENABLE_PAGES == 'true' && github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        run: npm run build -- --production
        env:
          SITE_URL: ${{ vars.SITE_URL }}
      - uses: actions/upload-pages-artifact@v3
        if: vars.ENABLE_PAGES == 'true' && github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        with:
          path: dist

  deploy:
    if: vars.ENABLE_PAGES == 'true' && github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    needs: build
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
