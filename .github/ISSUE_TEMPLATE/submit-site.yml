name: 申请收录官网
description: 推荐一个还没被收录的官方网站
title: "[收录] "
labels: [收录申请]
body:
  - type: input
    id: name
    attributes:
      label: 名称
      placeholder: 例如：中国铁路12306
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: 官网地址
      placeholder: https://
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: 归属主体
      description: 企业、机构、开发者或开源项目的名称；不确定时请说明。
    validations:
      required: true
  - type: dropdown
    id: purpose
    attributes:
      label: 入口用途
      options:
        - 首页
        - 下载
        - 文档
        - 登录
        - 源码
    validations:
      required: true
  - type: input
    id: region
    attributes:
      label: 地区与语言
      placeholder: 全球 / 英文，或中国大陆 / 简体中文
    validations:
      required: true
  - type: input
    id: aliases
    attributes:
      label: 常用简称 / 别名
      description: 大家平时怎么搜它？用逗号分隔
      placeholder: 12306, 火车票, 高铁票
  - type: textarea
    id: evidence
    attributes:
      label: 官方依据
      description: 提供可访问的原始来源链接，并说明它怎样把该主体与这个具体入口联系起来。备案、证书或“自称官网”不能单独作为结论。
      placeholder: |
        - 来源链接：https://...
        - 来源中的具体位置与归属关系：...
        - 查阅日期：YYYY-MM-DD
    validations:
      required: true
